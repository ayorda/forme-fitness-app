name: FORME final verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Automated app and PWA tests
        run: node --test test.js pwa.test.js food-art.test.js plan.test.js catalog.test.js home.test.js integration.test.js media.test.js offline.test.js timer.test.js i18n.test.js storage.test.js month.test.js hero.test.js exercise-translations.test.js food-translations.test.js workout-translations.test.js interface-translations.test.js locale-content.test.js language-switch.test.js progress.test.js storage-schema.test.js nutrition-journal.test.js backup.test.js food-photos.test.js exercise-photos.test.js state-normalizer.test.js resilience.test.js filters-search.test.js text-review.test.js i18n-coverage.test.js docs-links.test.js markup-integrity.test.js ci-workflow.test.js version-consistency.test.js code-hygiene.test.js workout-audio.test.js
      - name: Parse all JavaScript files
        run: |
          node --check data.js
          node --check app.js
          node --check core.js
          node --check exercise-art.js
          node --check exercise-photos.js
          node --check food-art.js
          node --check i18n.js
          node --check exercise-translations.js
          node --check food-translations.js
          node --check workout-translations.js
          node --check interface-translations.js
          node --check locale-content.js
          node --check food-photos.js
          node --check progress.js
          node --check storage-schema.js
          node --check state-normalizer.js
          node --check programs.js
          node --check nutrition-journal.js
          node --check backup.js
          node --check service-worker.js
          node --check workout-audio.js

  official-usda-audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Independent USDA 2018 SR Legacy audit of 30 records × 5 nutrients
        run: python3 audit-usda.py --report USDA-OFFICIAL-AUDIT.md
      - name: Upload detailed USDA comparison (when produced)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-usda-comparison
          path: USDA-OFFICIAL-AUDIT.md
          if-no-files-found: warn
