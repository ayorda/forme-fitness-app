name: FORME final verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Automated app and PWA tests
        run: node --test test.js modal-accessibility.test.js fonts.test.js pwa.test.js food-art.test.js plan.test.js catalog.test.js home.test.js integration.test.js media.test.js service-worker-video.test.js offline.test.js timer.test.js i18n.test.js storage.test.js month.test.js hero.test.js exercise-translations.test.js food-translations.test.js workout-translations.test.js interface-translations.test.js locale-content.test.js language-switch.test.js progress.test.js storage-schema.test.js nutrition-journal.test.js backup.test.js food-photos.test.js exercise-photos.test.js state-normalizer.test.js resilience.test.js filters-search.test.js text-review.test.js i18n-coverage.test.js docs-links.test.js markup-integrity.test.js ci-workflow.test.js version-consistency.test.js code-hygiene.test.js workout-audio.test.js set-conditions.test.js skill-trees.test.js recovery.test.js personalization.test.js auth.test.js cloud-sync.test.js privacy.test.js access.test.js firebase-client.test.js services.test.js workspaces.test.js sync-records.test.js auto-sync.test.js bootstrap.test.js local-copies.test.js security-policy.test.js
      - name: Reviewed exercise image publication gate
        run: |
          python3 -m pip install Pillow==12.0.0
          python3 -m unittest discover -s qa -p 'test_exercise_images.py'
      - name: Audit shipped audio/video codecs, size, hashes and MP4 faststart
        run: |
          if ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
          python3 -m unittest discover -s qa -p 'test_video_policy.py'
          python3 qa/video-audit.py
          python3 qa/audio-audit.py
      - name: Parse all JavaScript files
        run: |
          node --check data.js
          node --check app.js
          node --check modal-accessibility.js
          node --check core.js
          node --check exercise-art.js
          node --check exercise-photos.js
          node --check food-art.js
          node --check i18n.js
          node --check exercise-translations.js
          node --check food-translations.js
          node --check workout-translations.js
          node --check interface-translations.js
          node --check locale-content.js
          node --check food-photos.js
          node --check progress.js
          node --check storage-schema.js
          node --check state-normalizer.js
          node --check programs.js
          node --check nutrition-journal.js
          node --check backup.js
          node --check service-worker.js
          node --check workout-audio.js
          node --check skill-trees.js
          node --check recovery.js
          node --check personalization.js
          node --check firebase-client.js
          node --check access.js
          node --check services.js
          node --check workspaces.js
          node --check sync-records.js
          node --check auto-sync.js
          node --check bootstrap.js
          node --check pwa-register.js
          node --check local-copies.js
          node --check cloud-sync.js
          node --check auth.js
          node --check auth-config.js
          node --check vendor/firebase-auth-13.3.0.js

  official-usda-audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Independent USDA 2018 SR Legacy audit of 30 records × 5 nutrients
        run: python3 audit-usda.py --report USDA-OFFICIAL-AUDIT.md
      - name: Upload detailed USDA comparison (when produced)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-usda-comparison
          path: USDA-OFFICIAL-AUDIT.md
          if-no-files-found: warn

  firestore-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Archive, access and services security rules against local demo emulator
        run: npx -y firebase-tools@15.36.0 emulators:exec --only firestore --project demo-forme-sync "node qa/firestore-rules.mjs"

  deletion-maintenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Operator cleanup against local Auth and Firestore only
        run: npx -y firebase-tools@15.36.0 emulators:exec --only auth,firestore --project demo-forme-sync "node qa/deletion-maintenance.mjs"

  browser-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned local browser checks
        run: |
          python -m pip install -r qa/requirements-browser.txt
          python -m playwright install --with-deps chromium
      - name: Enforced CSP, offline PWA and official SDK with local demo emulators
        run: npx -y firebase-tools@15.36.0 emulators:exec --only auth,firestore --project demo-forme-sync "python qa/csp-browser.py"
      - name: Original yoga recordings, output, controls and offline playback
        run: python qa/yoga-audio-browser.py
      - name: Real local fonts, offline decoding and failed-font fallback
        run: python qa/fonts-browser.py
      - name: Modal focus, background isolation and offline restoration
        run: python qa/modal-browser.py
      - name: Reviewed exercise image decoding, bindings and offline cache upgrade
        run: python qa/exercise-images-browser.py
      - name: Reviewed real exercise clips, native playback, lazy loading and offline seek
        run: python qa/exercise-videos-browser.py
      - name: Upload synthetic browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-security
          path: |
            qa-results/csp.json
            qa-results/yoga-audio.json
            qa-results/fonts.json
            qa-results/modal.json
            qa-results/exercise-images.json
            qa-results/exercise-videos.json
            qa-results/videos/
          if-no-files-found: warn

  accessibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked audit tools without lifecycle scripts
        run: |
          npm ci --prefix qa --ignore-scripts --no-audit --no-fund
          python -m pip install -r qa/requirements-browser.txt
          python -m playwright install --with-deps chromium
      - name: Real CSP accessibility audit of 300 synthetic UI views
        run: python qa/a11y-browser.py
      - name: Upload accessibility audit including manual-review items
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accessibility
          path: qa-results/a11y.json
          if-no-files-found: warn
